<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lynn Musik</title>

<style>

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(
180deg,
#0f0f0f,
#151515,
#1a1a1a
);
color:white;
padding:20px;
text-align:center;
min-height:100vh;
}


h1{
color:#1DB954;
}

input{
width:70%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
padding:12px 20px;
background:#1DB954;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
margin-left:5px;
}

.card{
background:#1e1e1e;
padding:15px;
margin-top:15px;
border-radius:10px;
}

.card img{
width:120px;
border-radius:10px;
}

audio{
width:100%;
margin-top:10px;
}

.youtube{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:red;
color:white;
text-decoration:none;
border-radius:8px;
}

#splash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#121212;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

</style>
</head>
<body>
  
<div id="splash">
  <h1>🎵 Lynn Musik</h1>
</div>

<h1>🎵 Lynn Musik</h1>

<input
id="search"
placeholder="Cari lagu atau artis"
onkeypress="if(event.key==='Enter') cari()">

<button onclick="cari()">
Cari
</button>

<div id="hasil"></div>

<script>

async function cari(){

const keyword =
document.getElementById("search").value;

if(!keyword) return;

let html = "";

// iTunes
const appleResponse = await fetch(
`https://itunes.apple.com/search?term=${encodeURIComponent(keyword)}&entity=song&limit=5`
);

const appleData = await appleResponse.json();

html += `<h2>🍎 iTunes Preview</h2>`;

appleData.results.forEach(song=>{

const yt =
`https://www.youtube.com/results?search_query=${encodeURIComponent(song.trackName + " " + song.artistName)}`;

html += `
<div class="card">

<img src="${song.artworkUrl100}">

<h3>${song.trackName}</h3>

<p>${song.artistName}</p>

<audio controls>
<source src="${song.previewUrl}">
</audio>

<br>

<a
class="youtube"
href="${yt}"
target="_blank">
📺 Buka di YouTube
</a>

</div>
`;

});

// Jamendo
const jamendoResponse = await fetch(
`https://api.jamendo.com/v3.0/tracks/?client_id=70b24e31&format=json&limit=5&search=${encodeURIComponent(keyword)}`
);

const jamendoData = await jamendoResponse.json();

html += `<h2>🎵 Jamendo Full Song</h2>`;

jamendoData.results.forEach(song=>{

html += `
<div class="card">

<img src="${song.image}">

<h3>${song.name}</h3>

<p>${song.artist_name}</p>

<audio controls>
<source src="${song.audio}">
</audio>

</div>
`;

});

document.getElementById("hasil").innerHTML = html;

}

window.onload = function() {
    setTimeout(function() {
        document.getElementById("splash").style.display = "none";
    }, 2000);
}

</script>

</body>
</html>
